[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "train-model"
version = "0.1.0"
description = "Standard toolkit for training binary-classification (credit / propensity) models: feature selection, CatBoost training, evaluation and Spark batch prediction."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "BlueInfo Data Team" }]
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "catboost>=1.2",
  "optbinning>=0.19",
  "feature-engine>=1.6",
  "shap>=0.44",
  "matplotlib>=3.7",
  "seaborn>=0.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
spark = ["pyspark>=3.3", "pyarrow>=12"]
s3 = ["s3fs>=2023.1", "boto3>=1.26"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "ipykernel>=6.0",
  "nbconvert>=7.0",
  "nbformat>=5.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/train_model"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
