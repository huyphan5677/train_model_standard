# =====================================================================
# Model config — mỗi model mới: copy file này, đổi tên, sửa giá trị.
# =====================================================================

model:
  model_code: demo_cs_v1          # tên model, dùng làm tên thư mục artifacts
  target_col: GB                  # label 0/1
  id_col: msisdn                  # khoá định danh
  date_col: date                  # snapshot date dạng int yyyymmdd
  group_col: client               # cột nhóm (client / segment), để trống nếu không có

features:
  cat_cols:                       # cột categorical
    - device_manu
    - sub_type
    - demographic_province_l1m
  num_cols: null                  # null = tự lấy mọi cột số còn lại
  exclude_cols:                   # không bao giờ dùng làm feature
    - msisdn
    - date
    - client
  cat_fill: unknown               # giá trị thay cho NaN / chuỗi rỗng ở cột cat
  num_fill: null                  # null = giữ NaN (CatBoost tự xử lý)

split:
  split_date: 20250701            # test = date >= split_date; có thể là dict {client: date}
  val_size: 0.2                   # tỉ lệ validation lấy ngẫu nhiên từ phần train
  seed: 42

hard_selection:
  missing_threshold: 0.95         # loại cột có tỉ lệ missing > ngưỡng
  quasi_constant_tol: 0.98        # loại cột có 1 giá trị chiếm >= 98%
  iv_threshold: 0.02              # loại cột có IV < ngưỡng
  corr_threshold: 0.9             # cặp |corr| > ngưỡng -> bỏ cột IV thấp hơn
  max_n_bins: 10

soft_selection:
  top_k: 15                       # top-k cho các tiêu chí xếp hạng
  min_votes: 3                    # giữ feature đạt >= min_votes tiêu chí
  n_estimators: 200
  criteria:                       # bỏ dòng nào để tắt tiêu chí đó
    - correlation
    - permutation
    - single_feature
    - tree_importance
    - tree_vs_random
    - variance
    - mutual_info
    - l1
    - l2
    - rfe

catboost:
  iterations: 500
  depth: 4
  learning_rate: 0.05
  eval_metric: AUC
  early_stopping_rounds: 50

scoring:
  lower: 300
  upper: 850
  pct_lb: 0.01
  pct_ub: 0.99
  exponent: 1.3
  target_label: good              # good: label 1 = khách tốt; bad: label 1 = khách xấu

spark:
  app_name: train_model_predict
  master: "local[*]"              # trên cluster: để null, spark-submit tự set
  conf: {}                        # spark conf thêm (k8s, memory...). Key S3 lấy từ biến môi trường.

paths:
  artifacts_dir: artifacts
  predict_input: data/features    # parquet input cho predict Spark
  predict_output: data/predict    # nơi ghi kết quả predict
